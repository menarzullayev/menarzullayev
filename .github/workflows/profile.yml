name: profile

# Rebuilds the README images from live public data once a day.
# Third-party actions are pinned to commit SHAs. No personal token is used.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/facts.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Build images from live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/profile-data.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore(profile): refresh live data"
            git push
          fi
